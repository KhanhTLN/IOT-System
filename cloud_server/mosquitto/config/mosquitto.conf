# ==========================================
# CẤU HÌNH ECLIPSE MOSQUITTO MQTT BROKER (v2.0+)
# ==========================================

# Lắng nghe kết nối TCP chuẩn MQTT trên port 1883 từ mọi giao diện mạng (LAN / Localhost)
listener 1883 0.0.0.0

# Cho phép kết nối nặc danh trong mạng nội bộ thử nghiệm (Anonymous Mode)
allow_anonymous true

# Hỗ trợ giao thức WebSocket trên port 9001 (phục vụ Web UI / Dashboard nếu cần)
listener 9001 0.0.0.0
protocol websockets

# Lưu trữ dữ liệu phiên (Persistence)
persistence true
persistence_location /mosquitto/data/

# Ghi nhật ký hoạt động (Logging)
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
