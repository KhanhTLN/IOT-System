version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: iot_postgres_db
    restart: always
    environment:
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_password
      POSTGRES_DB: iot_sorting_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iot_backend_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://iot_user:iot_password@db:5432/iot_sorting_db
      - MQTT_BROKER=broker.hivemq.com
      - MQTT_PORT=1883
      - MQTT_TOPIC=factory/sorting/logs
    depends_on:
      - db

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: iot_dashboard_ui
    restart: always
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
