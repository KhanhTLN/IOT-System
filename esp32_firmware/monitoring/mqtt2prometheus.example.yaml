  - prom_name: servo_blue_last_sort_duration_seconds
    mqtt_name: blue.last_sort_duration_seconds
    help: Time from latest sort command to home command, -1 without a pending observed sort.
    type: gauge
  - prom_name: servo_yellow_state
    mqtt_name: yellow.state
    help: Original station state, 0=IDLE 1=ARMED 2=SORTING_WAIT_DROP.
    type: gauge
  - prom_name: servo_yellow_commanded_angle_degrees
    mqtt_name: yellow.servo_commanded_angle_degrees
    help: Last software commanded angle, not measured shaft position.
    type: gauge
  - prom_name: servo_yellow_pwm_attached
    mqtt_name: yellow.servo_pwm_attached
    help: Software PWM attachment, not proof of physical connectivity.
    type: gauge
  - prom_name: servo_yellow_sort_starts_total
