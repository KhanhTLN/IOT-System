  - prom_name: esp32_ir1_blocked
    mqtt_name: ir1.blocked
    help: Sampled IR input, 1=LOW/blocked.
    type: gauge
  - prom_name: esp32_ir1_falling_edges_total
    mqtt_name: ir1.falling_edges_total
    help: Observed HIGH to LOW transitions using the original sampled input.
    type: counter
  - prom_name: esp32_ir2_blocked
    mqtt_name: ir2.blocked
